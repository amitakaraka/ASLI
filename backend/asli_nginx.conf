# Nginx configuration for ASLI Backend Reverse Proxy
# You can append this or symlink into your /opt/homebrew/etc/nginx/nginx.conf

server {
    listen 8080;
    server_name _; 

    # Handle standard HTTP requests to the backend
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle Socket.io WebSockets explicitly
    location /socket.io {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Increase proxy timeouts for persistent websocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
