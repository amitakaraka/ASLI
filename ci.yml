name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: test-secret-key-12345678901234567890
      JWT_SECRET: test-jwt-secret-12345678901234567890
      DATABASE_URL: sqlite:///:memory:
      ASLI_AUTO_MIGRATE: "1"
      ASLI_SEED_DEMO_DATA: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest

      - name: Compile Python
        run: python -m compileall app.py config.py database modules services utils

      - name: Run tests
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Migration smoke test
        env:
          DATABASE_URL: sqlite:////tmp/asli_ci_migration.db
          ASLI_AUTO_MIGRATE: "0"
          ASLI_SEED_DEMO_DATA: "0"
        run: alembic upgrade head

  flutter:
    name: Flutter Analyze And Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asli_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
